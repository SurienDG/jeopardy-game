<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jeopardy Game</title>

<style>
body {
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  text-align:center;
}

h1 { margin:10px; }

.scoreboard {
  display:flex;
  justify-content:center;
  gap:40px;
  padding:10px;
}

.score-box {
  background:rgba(255,255,255,0.08);
  padding:10px 20px;
  border-radius:12px;
}

.score { font-size:32px; color:#ffd700; }

#board {
  display:grid;
  gap:6px;
  margin:20px;
}

.cell {
  background:linear-gradient(145deg,#1e3cba,#0d1b5e);
  border-radius:8px;
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
}

.header {
  background:#1565c0;
  font-weight:bold;
}

.used {
  background:#111 !important;
  color:#444 !important;
  cursor:default !important;
}

/* MODALS */
.screen {
  position:fixed;
  inset:0;
  display:none;
  background:rgba(0,0,0,0.92);
  justify-content:center;
  align-items:center;
}

.panel {
  background:rgba(255,255,255,0.10);
  padding:20px;
  border-radius:14px;
  width:650px;
}

.value {
  font-size:40px;
  color:#ffd700;
}

button {
  padding:10px 14px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#1976d2;
  color:white;
  cursor:pointer;
}

input {
  padding:8px;
  margin:5px;
  width:120px;
  text-align:center;
}

#feedback { margin-top:10px; font-size:16px; }
</style>
</head>

<body>

<h1>Jeopardy</h1>

<div class="scoreboard">
  <div class="score-box">Team 1<div id="score1" class="score">0</div></div>
  <div class="score-box">Team 2<div id="score2" class="score">0</div></div>
</div>

<input type="file" id="csvFile">
<button onclick="location.reload()">Reset</button>

<div id="board"></div>

<!-- QUESTION MODAL -->
<div id="modal" class="screen">
  <div class="panel">

    <div class="value" id="valueDisplay"></div>

    <div id="wagerBox" style="display:none;">
      <h2>🔥 DAILY DOUBLE 🔥</h2>
      <input id="wagerInput" type="number" placeholder="Min $5">
      <button onclick="lockWager()">LOCK</button>
    </div>

    <h2 id="question"></h2>
    <h3 id="answer" style="display:none;"></h3>

    <button onclick="revealAnswer()">Reveal Answer</button>

    <div id="controls" style="display:none;">
      <button onclick="score(1,true)">T1 ✔</button>
      <button onclick="score(1,false)">T1 ✖</button>
      <button onclick="score(2,true)">T2 ✔</button>
      <button onclick="score(2,false)">T2 ✖</button>
    </div>

    <div id="feedback"></div>
    <button onclick="closeModal()">Close</button>

  </div>
</div>

<!-- FINAL -->
<div id="finalScreen" class="screen">
  <div class="panel">

    <h1>FINAL JEOPARDY</h1>
    <h2 id="finalCategory"></h2>

    <p>Wagers (cannot exceed score)</p>
    <input id="wager1" type="number">
    <input id="wager2" type="number">

    <button onclick="lockFinal()">Lock Wagers</button>

    <h2 id="finalQuestion" style="display:none;"></h2>
    <button id="showAnsBtn" style="display:none;" onclick="showFinalAnswer()">Reveal Answer</button>
    <h3 id="finalAnswer" style="display:none;"></h3>

    <div id="finalControls" style="display:none;">
      <button onclick="finalScore(1,true)">T1 ✔</button>
      <button onclick="finalScore(1,false)">T1 ✖</button>
      <button onclick="finalScore(2,true)">T2 ✔</button>
      <button onclick="finalScore(2,false)">T2 ✖</button>
    </div>

  </div>
</div>

<!-- RESULTS -->
<div id="resultsScreen" class="screen">
  <div class="panel">
    <h1>Final Results</h1>
    <h2 id="finalScores"></h2>
    <h1 id="winner"></h1>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
let data=[], used={}, scores={1:0,2:0};
let finalData=null;
let currentValue=0;
let wager=0;
let dailyDouble=null;

const board = document.getElementById("board");
const modal = document.getElementById("modal");
const finalScreen = document.getElementById("finalScreen");
const resultsScreen = document.getElementById("resultsScreen");

const question = document.getElementById("question");
const answer = document.getElementById("answer");
const valueDisplay = document.getElementById("valueDisplay");
const controls = document.getElementById("controls");
const feedback = document.getElementById("feedback");

const score1 = document.getElementById("score1");
const score2 = document.getElementById("score2");

const finalCategory = document.getElementById("finalCategory");
const finalQuestion = document.getElementById("finalQuestion");
const finalAnswer = document.getElementById("finalAnswer");
const finalControls = document.getElementById("finalControls");
const showAnsBtn = document.getElementById("showAnsBtn");
const finalScores = document.getElementById("finalScores");
const winner = document.getElementById("winner");

/* LOAD CSV */
csvFile.onchange=e=>{
  const r=new FileReader();

  r.onload=evt=>{
    const rows=evt.target.result.trim().split("\n").map(r=>r.split(","));

    rows.shift();
    data=[]; finalData=null;

    rows.forEach(r=>{
      if(r[0]==="FINAL"){
        finalData={category:r[2],question:r[3],answer:r[4]};
      } else {
        data.push({category:r[0],value:+r[1],question:r[2],answer:r[3]});
      }
    });

    const keys=data.map(q=>q.category+"-"+q.value);
    dailyDouble=keys[Math.floor(Math.random()*keys.length)];

    render();
  };

  r.readAsText(e.target.files[0]);
};

/* RENDER BOARD */
function render(){
  board.innerHTML="";

  const cats=[...new Set(data.map(q=>q.category))];
  const vals=[...new Set(data.map(q=>q.value))].sort((a,b)=>a-b);

  const map={};
  data.forEach(q=>map[q.category+"-"+q.value]=q);

  board.style.gridTemplateColumns=`repeat(${cats.length},1fr)`;

  cats.forEach(c=>{
    const d=document.createElement("div");
    d.className="cell header";
    d.innerText=c;
    board.appendChild(d);
  });

  vals.forEach(v=>{
    cats.forEach(c=>{
      const key=c+"-"+v;
      const q=map[key];

      const d=document.createElement("div");
      d.className="cell";

      if(!q || used[key]){
        d.classList.add("used");
      } else {
        d.innerText="$"+v;
        d.onclick=()=>open(q,key);
      }

      board.appendChild(d);
    });
  });
}

/* OPEN QUESTION */
function open(q,key){
  if(used[key]) return;

  used[key]=true;
  currentValue=q.value;
  wager=q.value;

  modal.style.display="flex";

  question.innerText=q.question;
  answer.innerText=q.answer;
  answer.style.display="none";
  controls.style.display="none";
  feedback.innerText="";

  if(key===dailyDouble){
    wager=parseInt(prompt("DAILY DOUBLE WAGER"))||0;
  }

  valueDisplay.innerText="$"+wager;

  render();
}

/* ANSWER */
function revealAnswer(){
  answer.style.display="block";
  controls.style.display="block";
}

/* SCORE */
function score(t,correct){
  let val=wager;
  scores[t]+=correct?val:-val;

  score1.innerText=scores[1];
  score2.innerText=scores[2];

  feedback.innerText=`Team ${t} ${correct?"✔":"✖"} (${val})`;
}

/* CLOSE */
function closeModal(){
  modal.style.display="none";

  if(Object.keys(used).length===data.length){
    startFinal();
  }
}

/* FINAL JEOPARDY (FIXED RELIABLE VERSION) */
function startFinal(){
  if(!finalData) return;

  board.style.display="none";
  finalScreen.style.display="flex";

  finalCategory.innerText=finalData.category;
}

/* LOCK WAGERS */
function lockFinal(){
  const w1=+wager1.value||0;
  const w2=+wager2.value||0;

  if(w1>scores[1]||w2>scores[2]){
    alert("Wager too high!");
    return;
  }

  finalQuestion.innerText=finalData.question;
  finalQuestion.style.display="block";

  finalControls.style.display="block";
  showAnsBtn.style.display="inline-block";
}

/* SHOW FINAL ANSWER */
function showFinalAnswer(){
  finalAnswer.innerText=finalData.answer;
  finalAnswer.style.display="block";
}

/* FINAL SCORE */
function finalScore(t,correct){
  const w=+document.getElementById("wager"+t).value||0;

  scores[t]+=correct?w:-w;

  score1.innerText=scores[1];
  score2.innerText=scores[2];

  if(!window.f) window.f=0;
  window.f++;

  if(window.f>=2){
    finalScreen.style.display="none";
    resultsScreen.style.display="flex";

    finalScores.innerText=`T1: ${scores[1]} | T2: ${scores[2]}`;

    winner.innerText =
      scores[1]>scores[2] ? "🏆 Team 1 Wins" :
      scores[2]>scores[1] ? "🏆 Team 2 Wins" :
      "🤝 Tie";
  }
}
</script>

</body>
</html>
